<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrito | CampusShop</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>

    <header class="site-header">

        <nav class="navbar container">

            <a href="index.html" class="logo">

                <span class="logo-mark">
                    C
                </span>

                <span>
                    CampusShop
                </span>

            </a>


            <div class="nav-links">

                <a href="index.html">
                    Inicio
                </a>

                <a href="catalogo.html">
                    Catálogo
                </a>

                <a href="historial.html">
                    Pedidos
                </a>

                <a href="perfil.html">
                    Perfil
                </a>

            </div>


            <div class="nav-actions">

                <a href="catalogo.html" class="icon-link">
                    ⌕
                </a>

                <a href="carrito.html" class="icon-link">
                    🛒
                </a>

            </div>

        </nav>

    </header>


    <main class="section">

        <div class="container">

            <header class="page-header">

                <h1>
                    Mi carrito
                </h1>

                <p>
                    Revisa tus productos antes de continuar.
                </p>

            </header>


            <div class="cart-layout">


                <section id="cart-items"></section>


                <aside class="summary">

                    <h2>
                        Resumen
                    </h2>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <strong data-subtotal>
                            $164.800
                        </strong>

                    </div>


                    <div class="summary-row">

                        <span>
                            Envío
                        </span>

                        <strong>
                            $8.000
                        </strong>

                    </div>


                    <div class="summary-row summary-total">

                        <span>
                            Total
                        </span>

                        <strong data-total>
                            $172.800
                        </strong>

                    </div>


                    <a href="checkout.html" class="btn btn-block">
                        Continuar compra
                    </a>


                    <a href="catalogo.html" class="btn btn-secondary btn-block">
                        Seguir comprando
                    </a>

                </aside>

            </div>

        </div>

    </main>


    <footer class="site-footer">

        <div class="container">

            <div class="footer-bottom">
                © 2026 CampusShop. Proyecto académico.
            </div>

        </div>

    </footer>

    <script>
        const CART_KEY = 'campusCart';
        const subtotalEl = document.querySelector('[data-subtotal]');
        const totalEl = document.querySelector('[data-total]');
        const shipping = 8000;

        const formatCurrency = (value) => {
            return new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                maximumFractionDigits: 0
            }).format(value);
        };

        const getCart = () => {
            const cart = localStorage.getItem(CART_KEY);
            if (!cart) return [];
            try {
                return JSON.parse(cart);
            } catch (error) {
                return [];
            }
        };

        const saveCart = (items) => {
            localStorage.setItem(CART_KEY, JSON.stringify(items));
        };

        const renderCart = () => {
            const items = getCart();
            const cartSection = document.getElementById('cart-items');

            if (!items.length) {
                cartSection.innerHTML = `
                    <div class="empty-card">
                        <h3>Tu carrito está vacío</h3>
                        <p class="muted">Aún no has agregado productos.</p>
                        <a href="catalogo.html" class="btn btn-primary">Ver catálogo</a>
                    </div>
                `;
                subtotalEl.textContent = formatCurrency(0);
                totalEl.textContent = formatCurrency(8000);
                return;
            }

            cartSection.innerHTML = items.map((item) => `
                <article class="cart-item" data-id="${item.id}" data-price="${item.price}">
                    <div class="cart-thumb">
                        <img src="${item.image}" alt="${item.name}">
                    </div>

                    <div>
                        <div class="cart-meta">
                            <div>
                                <h3>${item.name}</h3>
                                <p class="muted">${item.category}</p>
                            </div>
                            <strong>${formatCurrency(item.price)}</strong>
                        </div>

                        <div class="cart-item-actions">
                            <span class="quantity">Cantidad: ${item.quantity || 1}</span>
                            <button class="remove-btn" type="button" data-id="${item.id}">Quitar</button>
                        </div>
                    </div>
                </article>
            `).join('');

            document.querySelectorAll('.remove-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const id = button.dataset.id;
                    const updatedCart = getCart().filter((item) => item.id !== id);
                    saveCart(updatedCart);
                    renderCart();
                });
            });

            const subtotal = items.reduce((total, item) => total + Number(item.price || 0) * Number(item.quantity || 1), 0);
            subtotalEl.textContent = formatCurrency(subtotal);
            totalEl.textContent = formatCurrency(subtotal + shipping);
        };

        renderCart();
    </script>

</body>

</html>
